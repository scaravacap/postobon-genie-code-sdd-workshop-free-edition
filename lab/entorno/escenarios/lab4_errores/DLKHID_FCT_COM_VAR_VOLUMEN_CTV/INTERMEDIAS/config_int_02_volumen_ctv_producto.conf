[Entrada]
tipo = intermedia
catalogo = {{Environment}}_glux
schema = stg
tabla = tt_stg_volumen_ctv_producto
alias = tt_stg_volumen_ctv_producto
tablas_entrada = [tt_stg_rollup_volumen, tt_stg_producto]
columnas = []

[QUERIES]
query_1 =
    SELECT r.cd_registro_nomina,
           r.cd_producto,
           r.vl_volumen_acum * COALESCE(f.vl_factor, 0) AS vl_volumen_ctv
    FROM tt_stg_rollup_volumen r
    INNER JOIN tt_stg_producto p
        ON r.cd_producto = p.cd_producto
    LEFT JOIN tt_stg_factor_ctv f
        ON p.cd_presentacion = f.cd_presentacion
