[Entrada]
tipo = insumo
catalogo = {{Environment}}_glux
schema = plata
tabla = commision_rollup_volumen
alias = tt_stg_rollup_volumen
tablas_entrada = []
columnas = []

[QUERIES]
query_1 =
    SELECT sk_fecha,
           cd_registro_nomina,
           cd_producto,
           vl_volumen_acum
    FROM {{catalogo}}.plata.commision_rollup_volumen
    WHERE sk_fecha = (SELECT l_fecha_ult_habil FROM {{catalogo}}.stg.par_com_var_volumen_ctv)
      AND cd_registro_nomina NOT LIKE 'DUMMY%%'
