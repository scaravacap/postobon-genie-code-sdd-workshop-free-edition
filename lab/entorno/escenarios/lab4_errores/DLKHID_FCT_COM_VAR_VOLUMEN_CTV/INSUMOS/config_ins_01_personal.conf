[Entrada]
tipo = insumo
catalogo = {{Environment}}_glux
schema = plata
tabla = he_source_sap_ecc_zbpta011
alias = tt_stg_personal
tablas_entrada = []
columnas = []

[QUERIES]
query_1 =
    SELECT regnom AS cd_registro_nomina,
           pernr,
           stext AS ds_cargo,
           planta AS cd_planta,
           zona AS cd_zona,
           DATE_FORMAT(TO_DATE(f_ingreso, 'MM/dd/yyyy'), 'yyyyMMdd') AS dt_ingreso,
           DATE_FORMAT(TO_DATE(f_retiro, 'MM/dd/yyyy'), 'yyyyMMdd') AS dt_retiro
    FROM {{catalogo}}.plata.he_source_sap_ecc_zbpta011
    WHERE stext LIKE '%REPRESENTANTE VENTAS%'
      AND bukrs <> 'CC01'
