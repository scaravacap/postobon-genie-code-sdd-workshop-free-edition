[Entrada]
tipo = salida
catalogo = {{Environment}}_glux
schema = oro
tabla = fct_com_var_volumen_ctv
alias = fct_com_var_volumen_ctv
tablas_entrada = [tt_stg_volumen_ctv_producto, tt_stg_registro_nomina]
columnas = []

[QUERIES]
query_1 =
    WITH por_vendedor AS (
        SELECT n.cd_planta,
               n.cd_registro_nomina,
               ROUND(SUM(v.vl_volumen_ctv), 4) AS vl_volumen_ctv
        FROM tt_stg_volumen_ctv_producto v
        INNER JOIN tt_stg_registro_nomina n
            ON v.cd_registro_nomina = n.cd_registro_nomina
        GROUP BY n.cd_planta, n.cd_registro_nomina
    )
    SELECT SUBSTR((SELECT l_fecha_fin FROM {{catalogo}}.stg.par_com_var_volumen_ctv), 1, 6) AS cd_periodo_mes,
           (SELECT l_fecha_fin FROM {{catalogo}}.stg.par_com_var_volumen_ctv) AS dt_corte,
           p.cd_planta,
           p.cd_registro_nomina,
           p.vl_volumen_ctv,
           CURRENT_TIMESTAMP() AS ts_carga
    FROM por_vendedor p
