[Entrada]
tipo = insumo
catalogo = {{Environment}}_glux
schema = oro
tabla = fct_pedido_venta
alias = tt_stg_pedidos
tablas_entrada = []
columnas = []

[QUERIES]
query_1 =
    SELECT sk_fecha,
           SUBSTR(dk_cliente, 5, 10) AS cd_cliente,
           cd_registro_nomina,
           nm_pedido,
           vl_venta_neta
    FROM {{catalogo}}.oro.fct_pedido_venta
    WHERE cd_tipo_documento = 'V'
      AND sk_fecha BETWEEN (SELECT l_fecha_ini FROM {{catalogo}}.stg.par_com_var_dropsize)
                       AND (SELECT l_fecha_fin FROM {{catalogo}}.stg.par_com_var_dropsize)
