[Entrada]
tipo = salida
catalogo = {{Environment}}_glux
schema = oro
tabla = fct_com_var_dropsize
alias = fct_com_var_dropsize
tablas_entrada = [tt_stg_ventas_portafolio, tt_stg_registro_nomina]
columnas = []

[QUERIES]
query_1 =
    WITH por_vendedor AS (
        SELECT r.cd_planta,
               r.cd_registro_nomina,
               ROUND(SUM(v.vl_venta_neta), 2) AS vl_venta_total,
               COUNT(DISTINCT v.nm_pedido) AS nm_pedidos
        FROM tt_stg_ventas_portafolio v
        INNER JOIN tt_stg_registro_nomina r
            ON v.cd_registro_nomina = r.cd_registro_nomina
        GROUP BY r.cd_planta, r.cd_registro_nomina
    )
    SELECT SUBSTR((SELECT l_fecha_fin FROM {{catalogo}}.stg.par_com_var_dropsize), 1, 6) AS cd_periodo_mes,
           (SELECT l_fecha_fin FROM {{catalogo}}.stg.par_com_var_dropsize) AS dt_corte,
           p.cd_planta,
           p.cd_registro_nomina,
           p.vl_venta_total,
           p.nm_pedidos,
           CASE WHEN p.nm_pedidos = 0 THEN 0 ELSE ROUND(p.vl_venta_total / p.nm_pedidos, 2) END AS vl_dropsize,
           CURRENT_TIMESTAMP() AS ts_carga
    FROM por_vendedor p
