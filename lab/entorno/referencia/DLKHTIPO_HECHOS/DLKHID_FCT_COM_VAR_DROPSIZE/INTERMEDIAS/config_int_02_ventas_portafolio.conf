[Entrada]
tipo = intermedia
catalogo = {{Environment}}_glux
schema = stg
tabla = tt_stg_ventas_portafolio
alias = tt_stg_ventas_portafolio
tablas_entrada = [tt_stg_pedidos, tt_stg_portafolio]
columnas = []

[QUERIES]
query_1 =
    SELECT v.cd_registro_nomina,
           v.cd_cliente,
           v.nm_pedido,
           v.vl_venta_neta
    FROM tt_stg_pedidos v
    INNER JOIN tt_stg_portafolio c
        ON v.cd_cliente = c.cd_cliente
    WHERE c.ds_portafolio IN ('OPT', 'EST')
      AND c.ds_canal LIKE '%%TRADICIONAL%%'
