[Entrada]
tipo = intermedia
catalogo = {{Environment}}_glux
schema = stg
tabla = tt_stg_registro_nomina
alias = tt_stg_registro_nomina
tablas_entrada = [tt_stg_personal]
columnas = []

[QUERIES]
query_1 =
    SELECT p.cd_registro_nomina,
           p.pernr,
           p.ds_cargo,
           p.cd_planta,
           p.cd_zona,
           CASE WHEN p.ds_cargo LIKE '%%AUTOSERVICIO%%' THEN 'AUTOSERVICIO' ELSE 'TRADICIONAL' END AS cd_canal
    FROM tt_stg_personal p
    WHERE p.dt_ingreso <= (SELECT l_fecha_fin FROM {{catalogo}}.stg.par_com_var_volumen_ctv)
      AND p.dt_retiro >= (SELECT l_fecha_fin FROM {{catalogo}}.stg.par_com_var_volumen_ctv)
