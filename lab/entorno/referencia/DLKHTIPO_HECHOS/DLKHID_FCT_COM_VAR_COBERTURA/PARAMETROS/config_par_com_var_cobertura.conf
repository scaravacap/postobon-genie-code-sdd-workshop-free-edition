[Entrada]
tipo = insumo
catalogo = {{Environment}}_glux
schema = stg
tabla = par_com_var_cobertura
alias = par_com_var_cobertura
tablas_entrada = []
columnas = []

[QUERIES]
query_1 =
    WITH entrada AS (
        SELECT '{{parametros[G_Fecha]}}' AS g_fecha
    ),
    habiles AS (
        SELECT sk_fecha
        FROM {{catalogo}}.oro.dim_fecha
        WHERE bl_dia_habil = 'SI'
    ),
    ultimo_habil_previo AS (
        SELECT MAX(h.sk_fecha) AS sk_fecha
        FROM habiles h
        WHERE h.sk_fecha < DATE_FORMAT(CURRENT_DATE(), 'yyyyMMdd')
    ),
    fin AS (
        SELECT CASE WHEN e.g_fecha = '19000101' THEN u.sk_fecha ELSE e.g_fecha END AS l_fecha_fin
        FROM entrada e
        CROSS JOIN ultimo_habil_previo u
    )
    SELECT f.l_fecha_fin,
           CONCAT(SUBSTR(f.l_fecha_fin, 1, 6), '01') AS l_fecha_ini,
           MAX(h.sk_fecha) AS l_fecha_ult_habil
    FROM fin f
    LEFT JOIN habiles h ON h.sk_fecha <= f.l_fecha_fin
    GROUP BY f.l_fecha_fin
