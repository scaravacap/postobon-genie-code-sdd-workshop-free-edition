[Entrada]
tipo = insumo
catalogo = {{Environment}}_glux
schema = plata
tabla = commision_cobertura
alias = tt_stg_metas
tablas_entrada = []
columnas = []

[QUERIES]
query_1 =
    SELECT cd_registro_nomina,
           CAST(nm_clientes_meta AS BIGINT) AS nm_clientes_meta
    FROM {{catalogo}}.plata.commision_cobertura
    WHERE cd_periodo = SUBSTR((SELECT l_fecha_fin FROM {{catalogo}}.stg.par_com_var_cobertura), 1, 6)
