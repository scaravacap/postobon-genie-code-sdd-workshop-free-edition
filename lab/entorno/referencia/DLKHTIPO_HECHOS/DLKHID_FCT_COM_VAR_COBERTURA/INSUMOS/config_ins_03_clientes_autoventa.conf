[Entrada]
tipo = insumo
catalogo = {{Environment}}_glux
schema = plata
tabla = he_source_celuweb_autoventa
alias = tt_stg_clientes_autoventa
tablas_entrada = []
columnas = []

[QUERIES]
query_1 =
    SELECT DISTINCT
           cd_registro_nomina,
           cd_cliente
    FROM {{catalogo}}.plata.he_source_celuweb_autoventa
    WHERE vl_venta > 0
      AND DATE_FORMAT(TO_DATE(fecha, 'yyyy-MM-dd'), 'yyyyMMdd')
          BETWEEN (SELECT l_fecha_ini FROM {{catalogo}}.stg.par_com_var_cobertura)
              AND (SELECT l_fecha_fin FROM {{catalogo}}.stg.par_com_var_cobertura)
