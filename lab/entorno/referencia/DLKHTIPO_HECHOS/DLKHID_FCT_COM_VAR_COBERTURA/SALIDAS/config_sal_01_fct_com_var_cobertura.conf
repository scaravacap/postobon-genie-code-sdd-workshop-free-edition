[Entrada]
tipo = salida
catalogo = {{Environment}}_glux
schema = oro
tabla = fct_com_var_cobertura
alias = fct_com_var_cobertura
tablas_entrada = [tt_stg_registro_nomina, tt_stg_metas, tt_stg_clientes_compra]
columnas = []

[QUERIES]
query_1 =
    SELECT SUBSTR((SELECT l_fecha_fin FROM {{catalogo}}.stg.par_com_var_cobertura), 1, 6) AS cd_periodo_mes,
           (SELECT l_fecha_fin FROM {{catalogo}}.stg.par_com_var_cobertura) AS dt_corte,
           r.cd_planta,
           r.cd_registro_nomina,
           m.nm_clientes_meta,
           COALESCE(c.nm_clientes_compra, 0) AS nm_clientes_compra,
           CASE WHEN m.nm_clientes_meta = 0 THEN 0
                ELSE ROUND(COALESCE(c.nm_clientes_compra, 0) / m.nm_clientes_meta, 4)
           END AS vl_cobertura,
           CURRENT_TIMESTAMP() AS ts_carga
    FROM tt_stg_registro_nomina r
    INNER JOIN tt_stg_metas m
        ON r.cd_registro_nomina = m.cd_registro_nomina
    LEFT JOIN tt_stg_clientes_compra c
        ON r.cd_registro_nomina = c.cd_registro_nomina
