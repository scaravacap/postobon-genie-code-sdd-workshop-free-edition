[Entrada]
tipo = intermedia
catalogo = {{Environment}}_glux
schema = stg
tabla = tt_stg_clientes_compra
alias = tt_stg_clientes_compra
tablas_entrada = [tt_stg_clientes_preventa, tt_stg_clientes_autoventa]
columnas = []

[QUERIES]
query_1 =
    WITH clientes AS (
        SELECT pv.cd_registro_nomina, pv.cd_cliente
        FROM tt_stg_clientes_preventa pv
        UNION ALL
        SELECT av.cd_registro_nomina, av.cd_cliente
        FROM tt_stg_clientes_autoventa av
    )
    SELECT c.cd_registro_nomina,
           COUNT(DISTINCT c.cd_cliente) AS nm_clientes_compra
    FROM clientes c
    GROUP BY c.cd_registro_nomina
